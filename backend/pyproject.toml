[tool.poetry]
package-mode = false

[project]
name = "backend"
version = "0.1.0"
description = "Backend do projeto C216 - Prática 1"
license = "MIT"
authors = [
    {name = "JaumGabriell",email = "joao.barbosa@gec.inatel.br"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.3,<0.17.0)"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # Permite Depends() em argumentos padrão (padrão FastAPI)

[tool.ruff.lint.isort]
known-first-party = ["app", "database", "models", "repositories", "core"]

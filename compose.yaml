services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://c216:c216@db:5432/c216
    volumes:
      - ./backend/app:/app/app
      - ./backend/core:/app/core
      - ./backend/database:/app/database
      - ./backend/models:/app/models
      - ./backend/repositories:/app/repositories
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
      ]

  db:
    image: postgres:15
    container_name: c216_db
    environment:
      POSTGRES_DB: c216
      POSTGRES_USER: c216
      POSTGRES_PASSWORD: c216
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c216 -d c216"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: [
      "npm", 
      "run",
      "dev",
      "--",
      "--host",
      "0.0.0.0"
      ]

volumes:
  postgres_data: